<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#A9D6E5">
  <title>Chéri-o-tchi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --gulf-blue: #A9D6E5;
      --gulf-blue-deep: #4E8FA6;
      --gulf-orange: #E8722A;
      --gulf-orange-deep: #C85A18;
      --shell: #EFF7FA;
      --ink: #2B3A42;
      --good: #6FBF73;
      --mid: #E8B93A;
      --low: #D9573B;
      --love: #E85D8A;
      --love-deep: #C63F6B;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', sans-serif;
      color: var(--ink);
      padding: 24px;
    }

    .device {
      width: 380px;
      max-width: 100%;
      background: linear-gradient(180deg, var(--gulf-blue) 0%, #ffffff 38%, #ffffff 62%, var(--gulf-blue) 100%);
      border-radius: 38px;
      padding: 22px 20px 26px;
      position: relative;
      box-shadow: 0 30px 60px -20px rgba(30, 60, 70, 0.35), 0 0 0 3px rgba(255, 255, 255, 0.6) inset;
      border: 3px solid var(--gulf-blue-deep);
      overflow: hidden;
    }

    .stripe {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 34px;
      transform: translateX(-50%);
      background: var(--gulf-orange);
      z-index: 0;
      opacity: 0.9;
    }

    .stripe::before,
    .stripe::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--gulf-orange-deep);
    }

    .stripe::before {
      left: -10px;
    }

    .stripe::after {
      right: -10px;
    }

    .brandrow {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.5px;
      font-size: 13px;
      color: var(--gulf-blue-deep);
      background: #fff;
      padding: 3px 10px;
      border-radius: 20px;
      border: 2px solid var(--gulf-blue-deep);
    }

    .title {
      position: relative;
      z-index: 2;
      text-align: center;
      font-weight: 800;
      font-size: 22px;
      color: var(--ink);
      margin: 0 0 4px;
    }

    .title[contenteditable] {
      outline: none;
      cursor: text;
      border-bottom: 2px dashed transparent;
    }

    .title:hover,
    .title:focus {
      border-bottom: 2px dashed var(--gulf-orange);
    }

    .subtitle {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 14px;
    }

    .subtitle span {
      display: inline-block;
      font-size: 12px;
      color: var(--gulf-blue-deep);
      font-family: 'Space Mono', monospace;
      background: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--gulf-blue-deep);
    }

    .screen-wrap {
      position: relative;
      z-index: 2;
      background: var(--ink);
      border-radius: 22px;
      padding: 8px;
      box-shadow: 0 0 0 3px var(--gulf-blue-deep), 0 8px 16px rgba(0, 0, 0, 0.25) inset;
    }

    .screen {
      position: relative;
      background: #ffffff;
      border-radius: 16px;
      height: 230px;
      overflow: hidden;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(169, 214, 229, 0.10) 0px, rgba(169, 214, 229, 0.10) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 5;
    }

    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26px;
      height: 1px;
      background: repeating-linear-gradient(90deg, #d8e6ea 0 10px, transparent 10px 20px);
    }

    .mood {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 20px;
      z-index: 6;
    }

    .bubble {
      position: absolute;
      top: 10px;
      left: 10px;
      max-width: 76%;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(-6px) scale(0.9);
      transition: all 0.25s ease;
      z-index: 7;
      pointer-events: none;
    }

    .bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .sprite-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
    }

    .sprite {
      position: absolute;
      bottom: 26px;
      width: 64px;
      height: auto;
      image-rendering: pixelated;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    .sprite-her {
      width: 58px;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .sprite-her.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .action-visual {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 8;
    }

    .action-visual.show {
      opacity: 1;
    }

    .action-visual img {
      height: 190px;
      width: auto;
      image-rendering: auto;
    }

    .action-caption {
      position: absolute;
      bottom: 34px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.85);
      padding: 4px 0;
    }

    .hug-visual {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: linear-gradient(180deg, #FFE8F0 0%, #ffffff 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 8;
    }

    .hug-visual.show {
      opacity: 1;
    }

    .hug-visual img {
      height: 150px;
      width: auto;
      image-rendering: pixelated;
    }

    .hug-visual img.hug-him {
      margin-right: -14px;
      transform: scaleX(-1);
    }

    .hug-visual img.hug-her {
      margin-left: -14px;
    }

    .heart {
      position: absolute;
      font-size: 16px;
      z-index: 9;
      pointer-events: none;
      animation: floatUp 1.1s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.6);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-70px) scale(1.1);
        opacity: 0;
      }
    }

    .stats {
      position: relative;
      z-index: 2;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-label {
      width: 84px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .bar-track {
      flex: 1;
      height: 12px;
      background: #e3edf0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--gulf-blue-deep);
    }

    .bar-fill {
      height: 100%;
      width: 80%;
      background: var(--good);
      transition: width 0.6s ease, background 0.6s ease;
    }

    .buttons {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .btn {
      background: #fff;
      border: 2px solid var(--gulf-blue-deep);
      border-radius: 14px;
      padding: 9px 4px 7px;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: transform 0.1s ease, background 0.15s ease;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
    }

    .btn span.emoji {
      font-size: 18px;
    }

    .btn:hover {
      background: var(--gulf-blue);
    }

    .btn:active {
      transform: scale(0.92);
    }

    .btn-hug {
      grid-column: 1 / -1;
      margin-top: 2px;
      background: linear-gradient(135deg, #FFE0EA 0%, #FFF0F5 100%);
      border-color: var(--love-deep);
      color: var(--love-deep);
      flex-direction: row;
      justify-content: center;
      gap: 8px;
      padding: 10px 4px;
      font-size: 13px;
    }

    .btn-hug span.emoji {
      font-size: 20px;
    }

    .btn-hug:hover {
      background: linear-gradient(135deg, #FFD0E0 0%, #FFE8F0 100%);
    }

    .footer-note {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 14px;
    }

    .footer-note span {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--gulf-blue-deep);
      background: #fff;
      padding: 3px 10px;
      border-radius: 16px;
      border: 1.5px solid var(--gulf-blue-deep);
      opacity: 0.9;
    }
  </style>
</head>

    // ---- State ----
    let state = { hunger: 78, energy: 78, happy: 78, love: 78, metBefore: false };
    let busy = false;
    let girlBusy = false;
    let direction = 1; // 1 = right, -1 = left
    let posX = 40;
    const screenEl = document.getElementById('screen');
    const spriteEl = document.getElementById('sprite');
    const spriteHerEl = document.getElementById('spriteHer');
    const moodEl = document.getElementById('mood');
    const bubbleEl = document.getElementById('bubble');
    const petNameEl = document.getElementById('petName');

    function clamp(v) { return Math.max(0, Math.min(100, v)); }

    // ---- Persistence (best-effort, safe if unavailable e.g. file:// on some browsers) ----
    function saveState() {
      try {
        localStorage.setItem('cheriotchi_state', JSON.stringify({
          hunger: state.hunger, energy: state.energy, happy: state.happy, love: state.love,
          name: petNameEl.textContent
        }));
      } catch (e) { /* storage unavailable, ignore silently */ }
    }
    function loadState() {
      try {
        const raw = localStorage.getItem('cheriotchi_state');
        if (raw) {
          const d = JSON.parse(raw);
          if (typeof d.hunger === 'number') state.hunger = d.hunger;
          if (typeof d.energy === 'number') state.energy = d.energy;
          if (typeof d.happy === 'number') state.happy = d.happy;
          if (typeof d.love === 'number') state.love = d.love;
          // metBefore is intentionally NOT restored: the birthday greeting
          // should play again every time the file is freshly opened.
          if (d.name) petNameEl.textContent = d.name;
        }
      } catch (e) { /* storage unavailable, ignore silently */ }
    }
    petNameEl.addEventListener('blur', saveState);

    function colorForValue(v) {
      if (v > 60) return getComputedStyle(document.documentElement).getPropertyValue('--good');
      if (v > 30) return getComputedStyle(document.documentElement).getPropertyValue('--mid');
      return getComputedStyle(document.documentElement).getPropertyValue('--low');
    }

    function renderStats() {
      document.getElementById('bar-hunger').style.width = state.hunger + '%';
      document.getElementById('bar-hunger').style.background = colorForValue(state.hunger);
      document.getElementById('bar-energy').style.width = state.energy + '%';
      document.getElementById('bar-energy').style.background = colorForValue(state.energy);
      document.getElementById('bar-happy').style.width = state.happy + '%';
      document.getElementById('bar-happy').style.background = colorForValue(state.happy);
      document.getElementById('bar-love').style.width = state.love + '%';
      document.getElementById('bar-love').style.background = getComputedStyle(document.documentElement).getPropertyValue('--love');

      const avg = (state.hunger + state.energy + state.happy + state.love) / 4;
      if (avg > 65) moodEl.textContent = '😊';
      else if (avg > 40) moodEl.textContent = '😐';
      else if (avg > 20) moodEl.textContent = '😟';
      else moodEl.textContent = '😢';

      saveState();
    }

    function showBubble(text, ms) {
      bubbleEl.textContent = text;
      bubbleEl.classList.add('show');
      clearTimeout(showBubble._t);
      showBubble._t = setTimeout(() => bubbleEl.classList.remove('show'), ms || 2200);
    }

    function spawnHeart(leftPx, bottomPx, emoji) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = emoji || '💙';
      heart.style.left = leftPx;
      heart.style.bottom = bottomPx;
      screenEl.appendChild(heart);
      setTimeout(() => heart.remove(), 1100);
    }

    // ---- Walking animation (him) ----
    let walkFrame = 0;
    let walkTimer = null;
    let bounceTimer = null;
    let bounceUp = false;

    function startWalking() {
      clearInterval(walkTimer);
      clearInterval(bounceTimer);
      const speed = state.energy < 25 ? 0 : (state.energy < 55 ? 1 : 2);

      if (speed === 0) {
        spriteEl.src = ASSETS.idle;
        return;
      }

      walkTimer = setInterval(() => {
        walkFrame = 1 - walkFrame;
        if (speed === 2) {
          spriteEl.src = walkFrame === 0 ? ASSETS.run : ASSETS.walk2;
        } else {
          spriteEl.src = walkFrame === 0 ? ASSETS.walk1 : ASSETS.walk2;
        }

        const screenWidth = screenEl.clientWidth;
        const maxX = screenWidth - spriteEl.clientWidth - 12;
        posX += direction * (speed === 2 ? 8 : 4.5);
        if (posX >= maxX) { posX = maxX; direction = -1; }
        if (posX <= 6) { posX = 6; direction = 1; }
        spriteEl.style.left = posX + 'px';
        spriteEl.style.transform = direction === 1 ? 'scaleX(1)' : 'scaleX(-1)';
      }, speed === 2 ? 130 : 190);

      bounceTimer = setInterval(() => {
        bounceUp = !bounceUp;
        spriteEl.style.bottom = bounceUp ? '29px' : '26px';
      }, speed === 2 ? 70 : 100);
    }

    // ---- Decay over time ----
    setInterval(() => {
      if (busy) return;
      state.hunger = clamp(state.hunger - (1 + Math.random() * 2));
      state.energy = clamp(state.energy - (0.6 + Math.random() * 1.2));
      state.happy = clamp(state.happy - (0.6 + Math.random() * 1.2));
      state.love = clamp(state.love - (0.3 + Math.random() * 0.7));
      renderStats();
      startWalking();

      if (state.hunger < 20 && Math.random() < 0.5) showBubble("J'ai faim... 🍔", 2000);
      else if (state.energy < 20 && Math.random() < 0.5) showBubble("Fatigué... 😪", 2000);
      else if (state.love < 20 && Math.random() < 0.5) showBubble("Tu me manques... 💌", 2200);
    }, 4000);

    // ---- Actions ----
    const actionVisual = document.getElementById('actionVisual');
    const actionImg = document.getElementById('actionImg');
    const actionCaption = document.getElementById('actionCaption');

    function doAction({ img, caption, delta, duration }) {
      if (busy || girlBusy) return;
      busy = true;
      clearInterval(walkTimer);
      clearInterval(bounceTimer);

      actionImg.src = img;
      actionCaption.textContent = caption;
      actionVisual.classList.add('show');

      state.hunger = clamp(state.hunger + (delta.hunger || 0));
      state.energy = clamp(state.energy + (delta.energy || 0));
      state.happy = clamp(state.happy + (delta.happy || 0));
      state.love = clamp(state.love + (delta.love || 0));
      renderStats();

      setTimeout(() => {
        actionVisual.classList.remove('show');
        busy = false;
        startWalking();
      }, duration || 1600);
    }

    // ---- Meals: random variety each time ----
    const FOODS = [
      { img: ASSETS.coffeeBig, caption: "Merci pour le café ☕", delta: { hunger: 22, happy: 8, energy: 8 } },
      { img: ASSETS.foodPizza, caption: "Une part de pizza, miam ! 🍕", delta: { hunger: 28, happy: 14, energy: -2 } },
      { img: ASSETS.foodBurger, caption: "Un bon gros burger ! 🍔", delta: { hunger: 30, happy: 10, energy: -2 } },
      { img: ASSETS.foodDrumstick, caption: "Ça creuse, ce poulet ! 🍗", delta: { hunger: 26, happy: 8, energy: 2 } },
      { img: ASSETS.foodWater, caption: "Un grand verre d'eau 💧", delta: { hunger: 6, happy: 4, energy: 14 } }
    ];
    let lastFoodIndex = -1;
    document.getElementById('btnCoffee').addEventListener('click', () => {
      let idx = Math.floor(Math.random() * FOODS.length);
      if (idx === lastFoodIndex) idx = (idx + 1) % FOODS.length;
      lastFoodIndex = idx;
      doAction({ ...FOODS[idx], duration: 1600 });
    });

    document.getElementById('btnRun').addEventListener('click', () => {
      doAction({
        img: ASSETS.runningBig,
        caption: "Ça défoule, un petit run ! 🏃",
        delta: { energy: -12, happy: 22, hunger: -14 },
        duration: 1600
      });
    });

    document.getElementById('btnCode').addEventListener('click', () => {
      doAction({
        img: ASSETS.laptopBig,
        caption: "Encore un bug à corriger... 💻",
        delta: { energy: -12, happy: -4, hunger: -6 },
        duration: 1600
      });
    });

    document.getElementById('btnSleep').addEventListener('click', () => {
      doAction({
        img: ASSETS.sleepBig,
        caption: "Zzz... 💤",
        delta: { energy: 32, happy: 6, hunger: -4 },
        duration: 2000
      });
    });

    // ---- Pet the sprite for a heart ----
    spriteEl.addEventListener('click', (e) => {
      if (busy || girlBusy) return;
      state.happy = clamp(state.happy + 4);
      renderStats();
      showBubble("💙", 900);
      spawnHeart(spriteEl.style.left, '70px', '💙');
    });

    // ---- Her random visits ----
    const SWEET_MESSAGES = [
      "Coucou mon cœur 😘",
      "Tu me manques 💌",
      "Je pense à toi 💕",
      "Bisous de loin 💋",
      "T'es le meilleur ⛽💛"
    ];

    function scheduleGirlVisit() {
      const isFirstEver = !state.metBefore;
      const delay = isFirstEver ? (2200 + Math.random() * 1300) : (7000 + Math.random() * 9000);
      setTimeout(() => {
        if (!busy && !girlBusy && (isFirstEver || Math.random() < 0.8)) {
          startGirlVisit();
        }
        scheduleGirlVisit();
      }, delay);
    }

    function startGirlVisit() {
      if (busy || girlBusy) return;
      girlBusy = true;
      busy = true;
      clearInterval(walkTimer);
      clearInterval(bounceTimer);

      const screenWidth = screenEl.clientWidth;
      const fromLeft = Math.random() < 0.5;
      let gx = fromLeft ? -40 : screenWidth + 10;
      const targetX = fromLeft
        ? Math.min(screenWidth - 70, posX + 46)
        : Math.max(6, posX - 46);

      // He notices her coming and turns to face her side right away.
      spriteEl.style.transform = fromLeft ? 'scaleX(1)' : 'scaleX(-1)';

      spriteHerEl.style.left = gx + 'px';
      spriteHerEl.style.bottom = '26px';
      spriteHerEl.src = ASSETS.herWalk1;
      spriteHerEl.style.transform = fromLeft ? 'scaleX(1)' : 'scaleX(-1)';
      spriteHerEl.classList.add('visible');

      let frame = 0;
      const herWalkTimer = setInterval(() => {
        frame = 1 - frame;
        spriteHerEl.src = frame === 0 ? ASSETS.herWalk1 : ASSETS.herWalk2;
        gx += fromLeft ? 7.5 : -7.5;
        spriteHerEl.style.left = gx + 'px';

        const arrived = fromLeft ? (gx >= targetX) : (gx <= targetX);
        if (arrived) {
          clearInterval(herWalkTimer);
          spriteHerEl.src = ASSETS.herIdle;
          girlArrived(fromLeft);
        }
      }, 160);
    }

    function girlArrived(cameFromLeft) {
      // Force a true face-to-face: whoever is on the right faces left, and vice versa.
      const herFinalX = parseFloat(spriteHerEl.style.left);
      const herIsRightOfHim = herFinalX > posX;
      spriteEl.style.transform = herIsRightOfHim ? 'scaleX(1)' : 'scaleX(-1)'; // he looks toward her
      spriteHerEl.style.transform = herIsRightOfHim ? 'scaleX(-1)' : 'scaleX(1)';  // she looks toward him

      let msg;
      let heartBoost = 1;
      if (!state.metBefore) {
        msg = "Joyeux anniversaire Stéphane 🎂🎉";
        state.metBefore = true;
        heartBoost = 3;
      } else {
        msg = SWEET_MESSAGES[Math.floor(Math.random() * SWEET_MESSAGES.length)];
      }
      showBubble(msg, heartBoost > 1 ? 3600 : 2600);
      state.love = clamp(state.love + (heartBoost > 1 ? 24 : 10));
      state.happy = clamp(state.happy + (heartBoost > 1 ? 20 : 6));
      renderStats();
      spawnHeart(spriteHerEl.style.left, '78px', '💕');
      if (heartBoost > 1) {
        setTimeout(() => spawnHeart(spriteHerEl.style.left, '95px', '🎉'), 200);
        setTimeout(() => spawnHeart(spriteHerEl.style.left, '60px', '🎂'), 400);
      }

      let blinkFrame = 0;
      const blinkTimer = setInterval(() => {
        if (!spriteHerEl.classList.contains('visible')) { clearInterval(blinkTimer); return; }
        blinkFrame = 1 - blinkFrame;
        spriteHerEl.src = blinkFrame === 0 ? ASSETS.herIdle : ASSETS.herIdleAlt;
      }, 900);

      setTimeout(() => {
        clearInterval(blinkTimer);
        leaveGirl(cameFromLeft);
      }, heartBoost > 1 ? 3400 : 2000);
    }

    function leaveGirl(cameFromLeft) {
      const screenWidth = screenEl.clientWidth;
      let gx = parseFloat(spriteHerEl.style.left);
      const goLeftDir = cameFromLeft; // she entered from the left, so she exits back to the left
      spriteHerEl.style.transform = goLeftDir ? 'scaleX(-1)' : 'scaleX(1)';

      let frame = 0;
      const exitTimer = setInterval(() => {
        frame = 1 - frame;
        spriteHerEl.src = frame === 0 ? ASSETS.herWalk1 : ASSETS.herWalk2;
        gx += goLeftDir ? -7.5 : 7.5;
        spriteHerEl.style.left = gx + 'px';

        const offscreen = goLeftDir ? (gx <= -50) : (gx >= screenWidth + 20);
        if (offscreen) {
          clearInterval(exitTimer);
          spriteHerEl.classList.remove('visible');
          girlBusy = false;
          busy = false;
          startWalking();
        }
      }, 160);
    }

    // ---- Hug button: dedicated couple interaction ----
    const hugVisual = document.getElementById('hugVisual');
    const hugCaption = document.getElementById('hugCaption');
    const HUG_CAPTIONS = [
      "Câlin de ta copine 🥰",
      "Un gros bisou rien que pour toi 💋",
      "Team pour la vie 💕⛽"
    ];

    document.getElementById('btnHug').addEventListener('click', () => {
      if (busy || girlBusy) return;
      busy = true;
      girlBusy = true;
      clearInterval(walkTimer);
      clearInterval(bounceTimer);
      spriteHerEl.classList.remove('visible');

      hugCaption.textContent = HUG_CAPTIONS[Math.floor(Math.random() * HUG_CAPTIONS.length)];
      hugVisual.classList.add('show');

      spawnHeart('40%', '150px', '💕');
      setTimeout(() => spawnHeart('55%', '160px', '💖'), 250);
      setTimeout(() => spawnHeart('48%', '140px', '💗'), 500);

      state.love = clamp(state.love + 26);
      state.happy = clamp(state.happy + 18);
      state.hunger = clamp(state.hunger + 4);
      state.energy = clamp(state.energy + 6);
      renderStats();

      setTimeout(() => {
        hugVisual.classList.remove('show');
        busy = false;
        girlBusy = false;
        startWalking();
      }, 1900);
    });

    // ---- Init ----
    loadState();
    spriteEl.style.left = posX + 'px';
    renderStats();
    startWalking();
    scheduleGirlVisit();
  </script>

</body>

</html>
